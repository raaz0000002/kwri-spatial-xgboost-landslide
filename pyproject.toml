[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavre-landslide-susceptibility"
version = "2.0.0"
description = "Spatially Validated Landslide Susceptibility Mapping in the Nepal Middle Hills: Sampling Bias, Spectral-Index Leakage and Training-Raster Consistency"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kavrepalanchowk Landslide Research Team" }
]
keywords = [
    "landslide-susceptibility",
    "spatial-machine-learning",
    "spatial-cross-validation",
    "kavrepalanchowk",
    "nepal-himalaya",
    "remote-sensing",
    "xgboost",
    "geohazards",
    "area-of-applicability"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
kavre-landslide = "run_workflow:main"
kwri-landslide = "run_workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
